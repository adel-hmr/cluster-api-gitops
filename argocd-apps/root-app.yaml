apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-apps-root
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  source:
    repoURL: 'https://github.com/adel-hmr/cluster-api-gitops.git'
    targetRevision: HEAD
    path: argocd-apps
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true